<div class="hub-page ai-assistants-page">
  <div class="hub-container">
    <div class="hub-header">
      <div>
        <span class="hub-kicker">IA CapEvents</span>
        <h1>Assistants IA</h1>
        <p class="header-sub">{{ activeDescription }}</p>
      </div>
    </div>

    <nav class="hub-tabs">
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          class="hub-tab"
          [class.active]="activeTab === tab.key"
          (click)="selectTab(tab.key)"
        >
          {{ tab.label }}
        </button>
      }
    </nav>

    <section class="assistant-content">
      @if (activeTab === 'hr-assistant') {
        <app-ai-hr-assistant-panel></app-ai-hr-assistant-panel>
      }

      @if (activeTab === 'planning') {
        <app-ai-planning-panel></app-ai-planning-panel>
      }
    </section>
  </div>
</div>
