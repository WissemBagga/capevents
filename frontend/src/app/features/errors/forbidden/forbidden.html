<div class="error-page error-403">
  <div class="page-container">
    <section class="error-card">
      <div class="error-content">
        <span class="error-kicker danger">Erreur 403</span>

        <h1>Accès refusé</h1>

        <p class="error-msg-secondary">
          Vous n’avez pas les permissions nécessaires pour accéder à cette page ou effectuer cette action.
        </p>

        <div class="error-helper">
          <span class="helper-pill danger-soft">
            Vérifiez votre rôle ou revenez vers une page autorisée sur CapEvents.
          </span>
        </div>

        <div class="error-actions">
          <a routerLink="/events" class="btn-secondary">
            Voir les événements
          </a>

          <button type="button" class="btn-primary" (click)="goBackOrHome()">
            Retour
          </button>
        </div>
      </div>

      <div class="error-visual" aria-hidden="true">
        <div class="visual-orbit orbit-one danger"></div>
        <div class="visual-orbit orbit-two"></div>

        <img
          src="/images/errors/403-access-denied.svg"
          alt=""
          class="error-illustration"
        />
      </div>
    </section>
  </div>
</div>
