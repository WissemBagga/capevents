<div class="error-page error-404">
  <div class="page-container">
    <section class="error-card">
      <div class="error-content">
        <div class="error-brand">
          <img
            src="/images/brand/capevents-logo-main.png"
            alt="CapEvents"
            class="error-brand-img"
          />
        </div>

        <h1>Page introuvable</h1>

        <p class="error-msg-secondary">
          La page demandée n’existe pas, a été déplacée ou le lien utilisé n’est plus valide.
        </p>

        <div class="error-helper">
          <span class="helper-pill">
            Revenez en arrière ou consultez les événements disponibles sur CapEvents.
          </span>
        </div>

        <div class="error-actions">
          <a routerLink="/events" class="btn-secondary">
            Voir les événements
          </a>

          <button type="button" class="btn-primary" (click)="goBackOrHome()">
            Retour
          </button>
        </div>
      </div>

      <div class="error-visual" aria-hidden="true">

        <img
          src="/images/errors/404-broken-robot.svg"
          alt=""
          class="error-illustration"
        />
      </div>
    </section>
  </div>
</div>
