<div class="hub-page settings-hub-page">
  <div class="hub-container">
    <div class="hub-header">
      <div>
        <h1>Paramètres</h1>
        <p>Gérez vos préférences et la sécurité de votre compte.</p>
      </div>
    </div>

    <nav class="hub-tabs">
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          class="hub-tab"
          [class.active]="activeTab === tab.key"
          (click)="selectTab(tab.key)"
        >
          {{ tab.label }}
        </button>
      }
    </nav>

    <section class="hub-content">
      @if (activeTab === 'departments') {
        <app-admin-departments [embedded]="true"></app-admin-departments>
      }

      @if (activeTab === 'users') {
        <app-admin-users [embedded]="true"></app-admin-users>
      }

      @if (activeTab === 'interests') {
        <app-my-interests [embedded]="true"></app-my-interests>
      }

      @if (activeTab === 'profile') {
        <app-my-profile [embedded]="true"></app-my-profile>
      }
    </section>
  </div>
</div>
